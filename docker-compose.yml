services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tracesoc
      POSTGRES_USER: tracesoc
      POSTGRES_PASSWORD: tracesoc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracesoc -d tracesoc"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["sh", "-c", "uv run --no-dev alembic upgrade head && exec uv run --no-dev uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://tracesoc:tracesoc@postgres:5432/tracesoc
      SCHEMA_REVISION: bootstrap
      AI_PROVIDER: mock
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TRACESOC_API_BASE_URL: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres-data:
